name: validate

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  question-sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Check Python and browser JavaScript syntax
        run: |
          python -m py_compile scripts/serve.py scripts/validate.py
          node --check viewer/graph.js
      - name: Run unit and server-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Validate every question set
        run: python scripts/validate.py
