name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  question-sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every question set
        run: python scripts/validate.py
